<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600">
<defs>
  <marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11Z" fill="#71838D"/></marker>
  <marker id="ab" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11Z" fill="#397DA5"/></marker>
  <marker id="at" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11Z" fill="#16807D"/></marker>
  <marker id="ao" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11Z" fill="#CF6B27"/></marker>
  <style>text{font-family:Arial,Helvetica,sans-serif}.head{font-size:20px;font-weight:bold;letter-spacing:.7px;fill:#284354}.nh{font-size:18px;font-weight:bold;fill:#203746}.body{font-size:15px;fill:#667983}.route{font-size:14px;font-weight:bold}</style>
</defs>
<rect width="1400" height="600" fill="#fff"/>
<rect x="25" y="25" width="1080" height="205" rx="13" fill="#F1F7FA"/>
<rect x="25" y="250" width="1350" height="315" rx="13" fill="#FCFCFB"/>
<!-- Bounded probe and cost-estimation ribbon -->
<text x="55" y="58" class="head">BOUNDED PROBING · COST ESTIMATION</text>
<rect x="765" y="38" width="300" height="30" rx="15" fill="#E2EDF3"/>
<text x="915" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#345C73">Probe time is charged to CPSS</text>
<path d="M490 138H565M790 138H865" fill="none" stroke="#71838D" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="285" y="92" width="205" height="92" rx="12" fill="#fff" stroke="#5AA5CD" stroke-width="2.5"/>
<text x="387.5" y="130" text-anchor="middle" class="nh">Sample windows</text>
<text x="387.5" y="157" text-anchor="middle" class="body">seeded, bounded regions</text>
<rect x="565" y="92" width="225" height="92" rx="12" fill="#fff" stroke="#5AA5CD" stroke-width="2.5"/>
<text x="677.5" y="124" text-anchor="middle" class="nh">Profile candidates</text>
<text x="677.5" y="149" text-anchor="middle" class="body">output bytes · encode/decode</text>
<text x="677.5" y="170" text-anchor="middle" class="body">sample-bundle path cost</text>
<rect x="820" y="92" width="265" height="92" rx="12" fill="#fff" stroke="#397DA5" stroke-width="2.5"/>
<text x="952.5" y="128" text-anchor="middle" class="nh">Estimate time to usable data</text>
<text x="952.5" y="157" text-anchor="middle" class="body">probe + prepare + wire + restore</text>
<!-- Full payload and two alternative branches -->
<text x="55" y="287" class="head">FULL-DATA PATH</text>
<path d="M150 385V330H250V138H285" fill="none" stroke="#397DA5" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#ab)"/>
<text x="157" y="317" font-size="13" font-weight="bold" fill="#397DA5">sample only</text>
<path d="M952.5 184V235H402V355" fill="none" stroke="#397DA5" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#ab)"/>
<rect x="649" y="220" width="175" height="24" rx="12" fill="#FCFCFB"/>
<text x="736.5" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#397DA5">predicted lower-cost action</text>
<rect x="55" y="385" width="190" height="82" rx="12" fill="#fff" stroke="#778790" stroke-width="2.5"/>
<text x="150" y="420" text-anchor="middle" class="nh" letter-spacing=".6px">INPUT TREE</text>
<text x="150" y="447" text-anchor="middle" class="body">full source payload</text>
<path d="M245 426H315" fill="none" stroke="#71838D" stroke-width="2.8" marker-end="url(#ag)"/>
<path d="M402.5 355L490 422.5L402.5 490L315 422.5Z" fill="#EAF2F6" stroke="#397DA5" stroke-width="2.5"/>
<text x="402.5" y="407" text-anchor="middle" font-size="16" font-weight="bold" fill="#203746">Choose lower</text>
<text x="402.5" y="430" text-anchor="middle" font-size="16" font-weight="bold" fill="#203746">estimated time</text>
<text x="402.5" y="454" text-anchor="middle" font-size="14" fill="#526773">Raw or compress</text>
<path d="M490 402H520V356H555" fill="none" stroke="#16807D" stroke-width="3" marker-end="url(#at)"/>
<rect x="555" y="315" width="220" height="82" rx="12" fill="#E5F2F2" stroke="#16807D" stroke-width="2.5"/>
<text x="665" y="350" text-anchor="middle" class="nh">Compress &amp; bundle</text>
<text x="665" y="376" text-anchor="middle" class="body">selected codec over full data</text>
<path d="M490 443H520V476H555" fill="none" stroke="#CF6B27" stroke-width="3" marker-end="url(#ao)"/>
<rect x="555" y="435" width="220" height="82" rx="12" fill="#FFF0E6" stroke="#CF6B27" stroke-width="2.5"/>
<text x="665" y="470" text-anchor="middle" class="nh">Raw bypass</text>
<text x="665" y="496" text-anchor="middle" class="body">original tree, unchanged</text>
<path d="M775 356H810V415H855M775 476H810V443H855" fill="none" stroke="#71838D" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="855" y="383" width="205" height="92" rx="12" fill="#F4F1E7" stroke="#B38A32" stroke-width="2.5"/>
<text x="957.5" y="418" text-anchor="middle" class="nh">Fixed transfer path</text>
<text x="957.5" y="444" text-anchor="middle" class="body">selected representation</text>
<text x="957.5" y="464" text-anchor="middle" class="body">+ bundle metadata</text>
<path d="M1060 429H1150" fill="none" stroke="#71838D" stroke-width="3" marker-end="url(#ag)"/>
<path d="M1110 290V525" fill="none" stroke="#C7CDD0" stroke-width="2" stroke-dasharray="7 7"/>
<rect x="1150" y="383" width="200" height="92" rx="12" fill="#F8F0F6" stroke="#A86C99" stroke-width="2.5"/>
<text x="1250" y="418" text-anchor="middle" class="nh" letter-spacing=".5px">USABLE TREE</text>
<text x="1250" y="444" text-anchor="middle" class="body">decode/rebuild bundle;</text>
<text x="1250" y="464" text-anchor="middle" class="body">materialize Raw otherwise</text>
<text x="957.5" y="535" text-anchor="middle" font-size="13" fill="#677780">Both actions share the configured transfer and receiver path</text>
</svg>
